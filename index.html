<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#faf5ee" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="DailyReport" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/png" href="./icons/icon-192.png" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
  <title>หน้าหลัก - DailyReport</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./css/tailwind.css" />
  <link rel="stylesheet" href="./css/app.css" />

</head>
<body class="bg-background text-on-background min-h-screen pb-24 md:pb-0">
  <!-- TopAppBar -->
  <header class="bg-surface border-b border-outline-variant flex justify-between items-center w-full px-margin-mobile md:px-margin-desktop h-touch-target-min sticky top-0 z-40">
    <div class="flex items-center gap-3">
      <span class="material-symbols-outlined text-primary">assignment_turned_in</span>
      <div class="flex items-center gap-2">
        <img id="app-logo" alt="Logo" class="h-7 w-7 object-contain rounded-md" src="icons/logo.png" />
        <h1 class="text-headline-md font-headline-md font-bold text-primary">DailyReport</h1>
      </div>
    </div>
    <div class="w-8 h-8 rounded-full overflow-hidden bg-surface-container flex items-center justify-center">
      <span class="material-symbols-outlined text-on-surface-variant">person</span>
    </div>
  </header>

  <main class="px-margin-mobile md:px-margin-desktop py-stack-lg max-w-4xl mx-auto space-y-stack-lg">
    <!-- Header -->
    <section class="flex flex-col gap-stack-sm">
      <h2 class="text-headline-lg-mobile md:text-headline-lg font-headline-lg-mobile md:font-headline-lg">หน้าหลัก</h2>
      <p class="text-body-md font-body-md text-on-surface-variant">เลือกวันที่เพื่อเริ่มรายงาน</p>
    </section>

    <!-- Calendar Card -->
    <section class="bg-surface-container-lowest border border-outline-variant rounded-xl p-stack-md flex flex-col gap-stack-md shadow-sm">
      <div class="flex justify-between items-center">
        <div class="flex items-center gap-3">
          <h3 id="cal-title" class="text-headline-md font-headline-md text-on-surface">—</h3>
          <span id="cal-loading" class="spinner spinner-sm hidden"></span>
        </div>
        <div class="flex gap-2">
          <button id="cal-prev" type="button" aria-label="เดือนก่อนหน้า" class="w-11 h-11 flex items-center justify-center rounded-full hover:bg-surface-container transition-colors"><span class="material-symbols-outlined text-on-surface-variant" aria-hidden="true">chevron_left</span></button>
          <button id="cal-next" type="button" aria-label="เดือนถัดไป" class="w-11 h-11 flex items-center justify-center rounded-full hover:bg-surface-container transition-colors"><span class="material-symbols-outlined text-on-surface-variant" aria-hidden="true">chevron_right</span></button>
        </div>
      </div>
      <div id="cal-grid" class="grid grid-cols-7 gap-1 text-center"></div>
    </section>

    <!-- Summary Card -->
    <section class="bg-surface-container-lowest border border-outline-variant rounded-xl p-stack-lg shadow-sm">
      <h3 class="text-headline-md font-headline-md text-on-surface flex items-center gap-2 mb-stack-md">
        <span class="material-symbols-outlined text-primary">today</span>
        <span id="sum-title">รายงานวันที่ —</span>
      </h3>
      <div id="sum-body" class="flex flex-col items-center justify-center py-stack-lg text-center bg-surface-container-low rounded-lg border border-dashed border-outline-variant">
        <div class="spinner"></div>
      </div>
    </section>

    <!-- Export CSV Card -->
    <section class="bg-surface-container-lowest border border-outline-variant rounded-xl p-4 shadow-sm">
      <h3 class="text-headline-md font-headline-md text-on-surface flex items-center gap-2 mb-1">
        <span class="material-symbols-outlined text-primary">file_download</span>
        <span>ส่งออก CSV</span>
      </h3>
      <p class="text-label-md font-label-md text-on-surface-variant mb-3">เลือกช่วงวันที่แล้วดาวน์โหลดข้อมูลทั้งหมด</p>
      <div class="grid grid-cols-2 gap-2 sm:gap-3">
        <label class="flex flex-col gap-1">
          <span class="text-label-md font-label-md text-on-surface-variant">จากวันที่</span>
          <input id="csv-start" type="date" class="w-full px-3 py-2.5 rounded-lg border border-outline-variant bg-surface text-on-background outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 text-body-md font-body-md" />
        </label>
        <label class="flex flex-col gap-1">
          <span class="text-label-md font-label-md text-on-surface-variant">ถึงวันที่</span>
          <input id="csv-end" type="date" class="w-full px-3 py-2.5 rounded-lg border border-outline-variant bg-surface text-on-background outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 text-body-md font-body-md" />
        </label>
      </div>
      <div class="mt-3 flex justify-end">
        <button id="csv-btn" class="flex items-center justify-center gap-2 px-5 py-2.5 bg-primary text-on-primary rounded-full hover:bg-primary-container transition-colors shadow-sm text-label-md font-label-md min-h-touch-target-min">
          <span class="material-symbols-outlined text-lg">download</span>
          ส่งออก CSV
        </button>
      </div>
    </section>
  </main>

  <!-- BottomNavBar -->
  <nav class="bottom-nav md:hidden">
    <div class="bottom-nav-inner">
      <a href="index.html" class="active" aria-current="page">
        <span class="material-symbols-outlined filled">dashboard</span>
        <span class="nav-label">หน้าหลัก</span>
      </a>
      <a href="search.html">
        <span class="material-symbols-outlined">search</span>
        <span class="nav-label">รายงาน</span>
      </a>
      <a href="create.html">
        <span class="material-symbols-outlined">add_circle</span>
        <span class="nav-label">เพิ่มรายงาน</span>
      </a>
      <a href="settings.html">
        <span class="material-symbols-outlined">settings</span>
        <span class="nav-label">ตั้งค่า</span>
      </a>
    </div>
  </nav>

  <script src="./config.js"></script>
  <script src="./js/app.js"></script>
  <script src="./js/home.js"></script>
</body>
</html>
