<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#faf5ee" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="DailyReport" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/png" href="./icons/icon-192.png" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
  <title>หน้าหลัก - DailyReport</title>

  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script>
    tailwind.config = {darkMode: "class", theme: {extend: {
      colors: {"on-primary":"#ffffff","surface-tint":"#c2652a","outline-variant":"#d8d0c8","surface-container":"#f2ece4","surface-variant":"#ece6dc",background:"#faf5ee","on-error-container":"#7a1a10","on-secondary-fixed-variant":"#504840","error-container":"#fce4e0","primary-fixed-dim":"#f0a878","inverse-primary":"#f0a878","on-secondary-fixed":"#2a2420","surface-container-low":"#f6f0e8",tertiary:"#8c3c3c","primary-fixed":"#fbe8d8","surface-dim":"#dcd6cc","secondary-fixed-dim":"#cec6be","secondary-fixed":"#eae2da","inverse-surface":"#3a302a","on-primary-fixed-variant":"#8a4518","on-primary-fixed":"#401a08","on-tertiary-container":"#3a2020",error:"#c0392b","on-surface":"#3a302a","surface-container-lowest":"#ffffff","tertiary-fixed":"#fce0e0","surface-bright":"#faf5ee","on-surface-variant":"#605850","on-background":"#3a302a","on-primary-container":"#fbe8d8",outline:"#9a9088",secondary:"#78706a","primary-container":"#e08850","on-tertiary-fixed":"#2e1515","surface-container-high":"#ece6dc",tertiary:"#8c3c3c","tertiary-fixed-dim":"#e8a0a0","surface-container-highest":"#e6e0d6","on-tertiary":"#ffffff",surface:"#faf5ee",error:"#c0392b","secondary-container":"#eae2da","on-tertiary-fixed-variant":"#6e3030","on-secondary":"#ffffff","inverse-on-surface":"#faf5ee",primary:"#c2652a","on-secondary-container":"#605850"},
      borderRadius: {DEFAULT: "0.25rem", lg: "0.5rem", xl: "0.75rem", full: "9999px"},
      spacing: {"margin-desktop":"2rem","touch-target-min":"48px","margin-mobile":"1rem","stack-md":"1rem","stack-lg":"1.5rem",gutter:"1rem","stack-sm":"0.5rem"},
      fontFamily: {"label-md":["Anuphan","Hanken Grotesk"],"body-md":["Anuphan","Hanken Grotesk"],"headline-lg":["Anuphan","Hanken Grotesk"],"data-tabular":["Anuphan","Hanken Grotesk"],"body-lg":["Anuphan","Hanken Grotesk"],"headline-lg-mobile":["Anuphan","Hanken Grotesk"],"headline-md":["Anuphan","Hanken Grotesk"],headline:["Eb Garamond"],display:["Eb Garamond"],body:["Anuphan","Hanken Grotesk"],label:["Anuphan","Hanken Grotesk"]},
      fontSize: {"label-md":["14px",{lineHeight:"20px",letterSpacing:"0.05em",fontWeight:"600"}],"body-md":["16px",{lineHeight:"24px",fontWeight:"400"}],"headline-lg":["32px",{lineHeight:"40px",letterSpacing:"-0.02em",fontWeight:"700"}],"data-tabular":["14px",{lineHeight:"20px",fontWeight:"500"}],"body-lg":["18px",{lineHeight:"28px",fontWeight:"400"}],"headline-lg-mobile":["24px",{lineHeight:"32px",fontWeight:"700"}],"headline-md":["20px",{lineHeight:"28px",fontWeight:"600"}]}
    }}}
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&family=Eb+Garamond:wght@400;500;700&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./css/app.css" />
</head>
<body class="bg-background text-on-background min-h-screen pb-24 md:pb-0">
  <!-- TopAppBar -->
  <header class="bg-surface border-b border-outline-variant flex justify-between items-center w-full px-margin-mobile md:px-margin-desktop h-touch-target-min sticky top-0 z-40">
    <div class="flex items-center gap-3">
      <span class="material-symbols-outlined text-primary">assignment_turned_in</span>
      <div class="flex items-center gap-2">
        <img id="app-logo" alt="Logo" class="h-7 w-7 object-contain rounded-md" src="icons/logo.png" />
        <h1 class="text-headline-md font-headline-md font-bold text-primary">DailyReport</h1>
      </div>
    </div>
    <div class="w-8 h-8 rounded-full overflow-hidden bg-surface-container flex items-center justify-center">
      <span class="material-symbols-outlined text-on-surface-variant">person</span>
    </div>
  </header>

  <main class="px-margin-mobile md:px-margin-desktop py-stack-lg max-w-4xl mx-auto space-y-stack-lg">
    <!-- Header -->
    <section class="flex flex-col gap-stack-sm">
      <h2 class="text-headline-lg-mobile md:text-headline-lg font-headline-lg-mobile md:font-headline-lg">หน้าหลัก</h2>
      <p class="text-body-md font-body-md text-on-surface-variant">เลือกวันที่เพื่อเริ่มรายงาน</p>
    </section>

    <!-- Calendar Card -->
    <section class="bg-surface-container-lowest border border-outline-variant rounded-xl p-stack-md flex flex-col gap-stack-md shadow-sm">
      <div class="flex justify-between items-center">
        <h3 id="cal-title" class="text-headline-md font-headline-md text-on-surface">—</h3>
        <div class="flex gap-2">
          <button id="cal-prev" class="p-2 rounded-full hover:bg-surface-container transition-colors"><span class="material-symbols-outlined text-on-surface-variant">chevron_left</span></button>
          <button id="cal-next" class="p-2 rounded-full hover:bg-surface-container transition-colors"><span class="material-symbols-outlined text-on-surface-variant">chevron_right</span></button>
        </div>
      </div>
      <div id="cal-grid" class="grid grid-cols-7 gap-1 text-center"></div>
    </section>

    <!-- Summary Card -->
    <section class="bg-surface-container-lowest border border-outline-variant rounded-xl p-stack-lg shadow-sm">
      <h3 class="text-headline-md font-headline-md text-on-surface flex items-center gap-2 mb-stack-md">
        <span class="material-symbols-outlined text-primary">today</span>
        <span id="sum-title">รายงานวันที่ —</span>
      </h3>
      <div id="sum-body" class="flex flex-col items-center justify-center py-stack-lg text-center bg-surface-container-low rounded-lg border border-dashed border-outline-variant">
        <div class="spinner"></div>
      </div>
    </section>
  </main>

  <!-- BottomNavBar -->
  <nav class="bottom-nav md:hidden">
    <div class="bottom-nav-inner">
      <a href="index.html" class="active">
        <span class="material-symbols-outlined filled">dashboard</span>
        <span class="nav-label">หน้าหลัก</span>
      </a>
      <a href="create.html">
        <span class="material-symbols-outlined">add_circle</span>
        <span class="nav-label">เพิ่มรายงาน</span>
      </a>
      <a href="settings.html">
        <span class="material-symbols-outlined">settings</span>
        <span class="nav-label">ตั้งค่า</span>
      </a>
    </div>
  </nav>

  <script src="./config.js"></script>
  <script src="./js/app.js"></script>
  <script src="./js/home.js"></script>
</body>
</html>
