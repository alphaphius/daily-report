<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#faf5ee" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="DailyReport" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/png" href="./icons/icon-192.png" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
  <title>ค้นหารายงาน - DailyReport</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./css/tailwind.css" />
  <link rel="stylesheet" href="./css/app.css" />

</head>
<body class="bg-background text-on-background min-h-screen pb-24 md:pb-0">
  <!-- TopAppBar -->
  <header class="bg-surface border-b border-outline-variant flex justify-between items-center w-full px-margin-mobile md:px-margin-desktop h-touch-target-min sticky top-0 z-40">
    <div class="flex items-center gap-3">
      <span class="material-symbols-outlined text-primary">assignment_turned_in</span>
      <div class="flex items-center gap-2">
        <img id="app-logo" alt="Logo" class="h-7 w-7 object-contain rounded-md" src="icons/logo.png" />
        <h1 class="text-headline-md font-headline-md font-bold text-primary">DailyReport</h1>
      </div>
    </div>
    <div class="w-8 h-8 rounded-full overflow-hidden bg-surface-container flex items-center justify-center">
      <span class="material-symbols-outlined text-on-surface-variant">person</span>
    </div>
  </header>

  <main class="px-margin-mobile md:px-margin-desktop py-stack-lg max-w-4xl mx-auto space-y-stack-lg">
    <section class="flex flex-col gap-stack-sm">
      <h2 class="text-headline-lg-mobile md:text-headline-lg font-headline-lg-mobile md:font-headline-lg">ค้นหารายงาน</h2>
      <p class="text-body-md font-body-md text-on-surface-variant">ค้นหาจากรายการ, หมายเหตุ, กลุ่มงาน หรือไซต์งาน</p>
    </section>

    <!-- Search Box -->
    <section class="bg-surface-container-lowest border border-outline-variant rounded-xl p-stack-md shadow-sm">
      <form id="search-form" class="flex flex-col sm:flex-row gap-3">
        <input id="search-input" type="search" placeholder="เช่น ตู้, ตรวจงาน, ซับกระจาย..." autocomplete="off"
          class="flex-1 px-4 py-3 rounded-full border border-outline-variant bg-surface text-on-background placeholder:text-on-surface-variant outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 text-body-md font-body-md" />
        <button id="search-btn" type="submit"
          class="flex items-center justify-center gap-2 px-6 py-3 bg-primary text-on-primary rounded-full hover:bg-primary-container transition-colors shadow-sm text-label-md font-label-md">
          <span class="material-symbols-outlined">search</span>
          ค้นหา
        </button>
      </form>
    </section>

    <!-- Results (Deck) -->
    <section id="results-wrap">
      <div id="results-hint" class="text-center text-body-md font-body-md text-on-surface-variant py-10">
        พิมพ์คำค้นหาเพื่อดูรายงานที่เกี่ยวข้อง
      </div>
      <div id="results" class="flex flex-col gap-4"></div>
    </section>
  </main>

  <!-- BottomNavBar -->
  <nav class="bottom-nav md:hidden">
    <div class="bottom-nav-inner">
      <a href="index.html">
        <span class="material-symbols-outlined">dashboard</span>
        <span class="nav-label">หน้าหลัก</span>
      </a>
      <a href="search.html" class="active" aria-current="page">
        <span class="material-symbols-outlined filled">search</span>
        <span class="nav-label">ค้นหา</span>
      </a>
      <a href="create.html">
        <span class="material-symbols-outlined">add_circle</span>
        <span class="nav-label">เพิ่มรายงาน</span>
      </a>
      <a href="settings.html">
        <span class="material-symbols-outlined">settings</span>
        <span class="nav-label">ตั้งค่า</span>
      </a>
    </div>
  </nav>

  <script src="./config.js"></script>
  <script src="./js/app.js"></script>
  <script src="./js/search.js"></script>
</body>
</html>
