<!DOCTYPE html>
<html lang="th">

  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />

      colors: {"on-primary":"#ffffff","surface-tint":"#c2652a","outline-variant":"#d8d0c8","surface-container":"#f2ece4","surface-variant":"#ece6dc",background:"#faf5ee","on-error-container":"#7a1a10","on-secondary-fixed-variant":"#504840","error-container":"#fce4e0","primary-fixed-dim":"#f0a878","inverse-primary":"#f0a878","on-secondary-fixed":"#2a2420","surface-container-low":"#f6f0e8",tertiary:"#8c3c3c","primary-fixed":"#fbe8d8","surface-dim":"#dcd6cc","secondary-fixed-dim":"#cec6be","secondary-fixed":"#eae2da","inverse-surface":"#3a302a","on-primary-fixed-variant":"#8a4518","on-primary-fixed":"#401a08","on-tertiary-container":"#3a2020",error:"#c0392b","on-surface":"#3a302a","surface-container-lowest":"#ffffff","tertiary-fixed":"#fce0e0","surface-bright":"#faf5ee","on-surface-variant":"#605850","on-background":"#3a302a","on-primary-container":"#fbe8d8",outline:"#9a9088",secondary:"#78706a","primary-container":"#e08850","on-tertiary-fixed":"#2e1515","surface-container-high":"#ece6dc","tertiary-fixed-dim":"#e8a0a0","surface-container-highest":"#e6e0d6","on-tertiary":"#ffffff",surface:"#faf5ee",error:"#c0392b","secondary-container":"#eae2da","on-tertiary-fixed-variant":"#6e3030","on-secondary":"#ffffff","inverse-on-surface":"#faf5ee",primary:"#c2652a","on-secondary-container":"#605850"},
      borderRadius: {DEFAULT: "0.25rem", lg: "0.5rem", xl: "0.75rem", full: "9999px"},
      spacing: {"margin-desktop":"2rem","touch-target-min":"48px","margin-mobile":"1rem","stack-md":"1rem","stack-lg":"1.5rem",gutter:"1rem","stack-sm":"0.5rem"},
      fontFamily: {"label-md":["Anuphan","Hanken Grotesk"],"body-md":["Anuphan","Hanken Grotesk"],"headline-lg":["Anuphan","Hanken Grotesk"],"data-tabular":["Anuphan","Hanken Grotesk"],"body-lg":["Anuphan","Hanken Grotesk"],"headline-lg-mobile":["Anuphan","Hanken Grotesk"],"headline-md":["Anuphan","Hanken Grotesk"],headline:["Eb Garamond"],display:["Eb Garamond"],body:["Anuphan","Hanken Grotesk"],label:["Anuphan","Hanken Grotesk"]},
      fontSize: {"label-md":["14px",{lineHeight:"20px",letterSpacing:"0.05em",fontWeight:"600"}],"body-md":["16px",{lineHeight:"24px",fontWeight:"400"}],"headline-lg":["32px",{lineHeight:"40px",letterSpacing:"-0.02em",fontWeight:"700"}],"data-tabular":["14px",{lineHeight:"20px",fontWeight:"500"}],"body-lg":["18px",{lineHeight:"28px",fontWeight:"400"}],"headline-lg-mobile":["24px",{lineHeight:"32px",fontWeight:"700"}],"headline-md":["20px",{lineHeight:"28px",fontWeight:"600"}]}

  <link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&family=Eb+Garamond:wght@400;500;700&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="./css/app.css" />
</head>
<body class="text-on-background min-h-screen pb-24 md:pb-0">
  <!-- TopAppBar -->
  <header class="bg-surface border-b border-outline-variant flex justify-between items-center w-full px-margin-mobile md:px-margin-desktop h-touch-target-min sticky top-0 z-40">
    <div class="flex items-center gap-2">
      <a href="index.html" class="h-10 w-10 flex items-center justify-center rounded-full hover:bg-surface-container transition-colors duration-200">
        <span class="material-symbols-outlined text-primary">assignment_turned_in</span>
      </a>
      <h1 class="text-headline-md font-headline-md font-bold text-primary">DailyReport</h1>
    </div>
    <div class="flex items-center gap-4">
      <h2 class="text-headline-md font-headline-md font-bold text-on-surface">ตัวอย่างรายงาน</h2>
      <div class="h-8 w-8 rounded-full bg-surface-container flex items-center justify-center">
        <span class="material-symbols-outlined text-on-surface-variant">person</span>
      </div>
    </div>
  </header>

  <main class="max-w-4xl mx-auto mt-stack-lg px-margin-mobile md:px-margin-desktop">
    <!-- loading state -->
    <div id="loading-box" class="flex flex-col items-center justify-center py-20">
      <div class="spinner"></div>
      <p class="mt-4 text-on-surface-variant">กำลังโหลดรายงาน...</p>
    </div>

    <!-- Document Container (A4 style) -->
    <div id="doc-wrap" class="hidden">
      <div class="doc-scale-wrap rounded-lg shadow-sm">
        <div id="report-doc" class="report-doc border border-outline-variant rounded-lg p-8"></div>
      </div>
      <!-- Action Buttons -->
      <div class="mt-stack-lg flex flex-col sm:flex-row gap-4 justify-end mb-stack-lg">
        <button id="btn-image" class="flex items-center justify-center gap-2 px-6 py-3 border-2 border-primary text-primary rounded-full hover:bg-primary/5 transition-colors text-label-md font-label-md">
          <span class="material-symbols-outlined">image</span>
          บันทึกเป็นรูปภาพ
        </button>
        <button id="btn-pdf" class="flex items-center justify-center gap-2 px-6 py-3 bg-secondary-container text-on-secondary-container rounded-full hover:bg-secondary-container/90 transition-colors shadow-sm text-label-md font-label-md">
          <span class="material-symbols-outlined">picture_as_pdf</span>
          ส่งออกเป็น PDF
        </button>
      </div>
    </div>
  </main>

  <script src="./config.js"></script>
  <script src="./js/app.js"></script>
  <script src="./vendor/html2canvas.min.js"></script>
  <script src="./vendor/jspdf.umd.min.js"></script>
  <script src="./vendor/anuphan-fonts.js"></script>
  <script src="./js/preview.js"></script>
</body>
</html>
