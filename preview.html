<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#faf5ee" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="DailyReport" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/png" href="./icons/icon-192.png" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
  <title>ตัวอย่างรายงาน - DailyReport</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./css/tailwind.css" />
  <link rel="stylesheet" href="./css/app.css" />

</head>
<body class="text-on-background min-h-screen pb-24 md:pb-0">
  <!-- TopAppBar -->
  <header class="bg-surface border-b border-outline-variant flex justify-between items-center w-full px-margin-mobile md:px-margin-desktop h-touch-target-min sticky top-0 z-40">
    <div class="flex items-center gap-2">
      <a href="index.html" class="h-10 w-10 flex items-center justify-center rounded-full hover:bg-surface-container transition-colors duration-200">
        <span class="material-symbols-outlined text-primary">assignment_turned_in</span>
      </a>
      <h1 class="text-headline-md font-headline-md font-bold text-primary">DailyReport</h1>
    </div>
    <div class="flex items-center gap-4">
      <h2 class="text-headline-md font-headline-md font-bold text-on-surface">ตัวอย่างรายงาน</h2>
      <div class="h-8 w-8 rounded-full bg-surface-container flex items-center justify-center">
        <span class="material-symbols-outlined text-on-surface-variant">person</span>
      </div>
    </div>
  </header>

  <main class="max-w-4xl mx-auto mt-stack-lg px-margin-mobile md:px-margin-desktop">
    <!-- loading state -->
    <div id="loading-box" class="flex flex-col items-center justify-center py-20">
      <div class="spinner"></div>
      <p class="mt-4 text-on-surface-variant">กำลังโหลดรายงาน...</p>
    </div>

    <!-- Document Container (A4 style) -->
    <div id="doc-wrap" class="hidden">
      <div class="doc-scale-wrap rounded-lg shadow-sm">
        <div id="report-doc" class="report-doc border border-outline-variant rounded-lg"></div>
      </div>
      <!-- Action Buttons -->
      <div class="mt-stack-lg flex flex-col sm:flex-row gap-4 justify-end mb-stack-lg">
        <button id="btn-del-preview" type="button" class="flex items-center justify-center gap-2 px-6 py-3 border-2 border-error text-error rounded-full hover:bg-error-container transition-colors text-label-md font-label-md">
          <span class="material-symbols-outlined">delete</span>
          ลบรายงาน
        </button>
        <button id="btn-image" class="flex items-center justify-center gap-2 px-6 py-3 border-2 border-primary text-primary rounded-full hover:bg-primary/5 transition-colors text-label-md font-label-md">
          <span class="material-symbols-outlined">image</span>
          บันทึกเป็นรูปภาพ
        </button>
        <button id="btn-pdf" class="flex items-center justify-center gap-2 px-6 py-3 bg-primary text-on-primary rounded-full hover:bg-primary-container transition-colors shadow-sm text-label-md font-label-md">
          <span class="material-symbols-outlined">picture_as_pdf</span>
          ส่งออกเป็น PDF
        </button>
      </div>
    </div>
  </main>

  <script src="./config.js"></script>
  <script src="./js/app.js"></script>
  <script src="./js/preview.js"></script>
</body>
</html>
